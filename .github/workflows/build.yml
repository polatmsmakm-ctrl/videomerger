name: Build VideoMerger IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen >/dev/null && xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project VideoMerger.xcodeproj -scheme VideoMerger -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/VideoMerger.app Payload/
          zip -qr VideoMerger.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VideoMerger-ipa
          path: VideoMerger.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view videomerger >/dev/null 2>&1 || gh release create videomerger --title "VideoMerger IPA" --notes "IPA غير موقّع لـ Sideloadly"
          gh release upload videomerger VideoMerger.ipa --clobber
